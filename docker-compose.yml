services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      GROQ_API_KEY: ${GROQ_API_KEY:?Set GROQ_API_KEY in .env}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      GROQ_COOLDOWN_SECONDS: ${GROQ_COOLDOWN_SECONDS:-60}
      QWEN3_ENDPOINT_URL: ${QWEN3_ENDPOINT_URL:-}
      QWEN3_MODEL_ID: ${QWEN3_MODEL_ID:-qwen3-4b-finetuned}
      QWEN3_TIMEOUT: ${QWEN3_TIMEOUT:-60.0}
      QWEN3_SUPPORTS_TOOLS: ${QWEN3_SUPPORTS_TOOLS:-false}
      HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://127.0.0.1:5500,http://localhost:5500}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
